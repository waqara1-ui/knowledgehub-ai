# docker-compose.yml
# Note to self - running everything:            docker compose up --build
# Run with a local LLM too:  docker compose --profile local-llm up --build
services:
  db:
    # pgvector/pgvector ships Postgres with the vector extension already
    # compiled in, so there is nothing to install at runtime.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loglens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loglens}
      POSTGRES_DB: ${POSTGRES_DB:-loglens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can inspect the database with psql or a GUI client.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loglens} -d ${POSTGRES_DB:-loglens}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-loglens}:${POSTGRES_PASSWORD:-loglens}@db:5432/${POSTGRES_DB:-loglens}
      # Inside Compose, "localhost" is the app container itself, so an Ollama
      # running on your host is not reachable that way.
      #   Ollama in the local-llm profile below -> http://ollama:11434
      #   Ollama on your host machine           -> http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploaded_files
    depends_on:
      db:
        condition: service_healthy

  # Optional: a fully local, free LLM. Started only with --profile local-llm.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  uploads:
  ollama: